<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <style>
      .pkg-box { rx: 8; ry: 8; stroke-width: 2; }
      .pkg-label { font-size: 13px; font-weight: 600; fill: #ffffff; }
      .pkg-desc { font-size: 10px; fill: #e0e0e0; }
      .arrow { stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .title { font-size: 18px; font-weight: 700; fill: #1a1a2e; }
      .subtitle { font-size: 11px; fill: #6b7280; }
      .layer-label { font-size: 11px; font-weight: 600; fill: #9ca3af; text-transform: uppercase; letter-spacing: 1px; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <linearGradient id="grad-bringup" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#16304d"/>
    </linearGradient>
    <linearGradient id="grad-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d4a6f"/>
      <stop offset="100%" style="stop-color:#223d5c"/>
    </linearGradient>
    <linearGradient id="grad-sim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a6741"/>
      <stop offset="100%" style="stop-color:#3d5636"/>
    </linearGradient>
    <linearGradient id="grad-nav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6b4c8a"/>
      <stop offset="100%" style="stop-color:#5a3d76"/>
    </linearGradient>
    <linearGradient id="grad-desc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b6f47"/>
      <stop offset="100%" style="stop-color:#76603e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="#fafbfc" rx="12"/>
  <rect x="0" y="0" width="900" height="50" fill="#1a1a2e" rx="12"/>
  <rect x="0" y="25" width="900" height="25" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="450" y="33" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">TadeoeCar - Package Architecture</text>

  <!-- Layer labels -->
  <text x="30" y="85" class="layer-label">ORCHESTRATION</text>
  <text x="30" y="195" class="layer-label">PERCEPTION &amp; PLANNING</text>
  <text x="30" y="335" class="layer-label">CORE SYSTEMS</text>
  <text x="30" y="455" class="layer-label">FOUNDATION</text>

  <!-- Bringup Layer -->
  <rect x="180" y="65" width="200" height="55" class="pkg-box" fill="url(#grad-bringup)" stroke="#1e3a5f"/>
  <text x="280" y="88" text-anchor="middle" class="pkg-label">tadeocar_bringup</text>
  <text x="280" y="105" text-anchor="middle" class="pkg-desc">slam | vslam | navigation</text>

  <!-- Perception Layer -->
  <rect x="60" y="175" width="190" height="55" class="pkg-box" fill="url(#grad-nav)" stroke="#6b4c8a"/>
  <text x="155" y="198" text-anchor="middle" class="pkg-label">tadeocar_slam</text>
  <text x="155" y="215" text-anchor="middle" class="pkg-desc">SLAM Toolbox (LiDAR)</text>

  <rect x="270" y="175" width="190" height="55" class="pkg-box" fill="url(#grad-nav)" stroke="#6b4c8a"/>
  <text x="365" y="198" text-anchor="middle" class="pkg-label">tadeocar_vslam</text>
  <text x="365" y="215" text-anchor="middle" class="pkg-desc">RTAB-Map (ZED2i Stereo)</text>

  <rect x="480" y="175" width="190" height="55" class="pkg-box" fill="url(#grad-nav)" stroke="#6b4c8a"/>
  <text x="575" y="198" text-anchor="middle" class="pkg-label">tadeocar_navigation</text>
  <text x="575" y="215" text-anchor="middle" class="pkg-desc">Nav2 (AMCL + DWB)</text>

  <!-- Core Layer -->
  <rect x="60" y="315" width="240" height="55" class="pkg-box" fill="url(#grad-core)" stroke="#2d4a6f"/>
  <text x="180" y="338" text-anchor="middle" class="pkg-label">tadeocar_control</text>
  <text x="180" y="355" text-anchor="middle" class="pkg-desc">4WS Kinematics | twist_mux | Xbox | Web</text>

  <rect x="320" y="315" width="240" height="55" class="pkg-box" fill="url(#grad-sim)" stroke="#4a6741"/>
  <text x="440" y="338" text-anchor="middle" class="pkg-label">tadeocar_gazebo</text>
  <text x="440" y="355" text-anchor="middle" class="pkg-desc">SDF Model | Worlds | Bridge | odom_to_tf</text>

  <!-- Foundation Layer -->
  <rect x="180" y="435" width="300" height="55" class="pkg-box" fill="url(#grad-desc)" stroke="#8b6f47"/>
  <text x="330" y="458" text-anchor="middle" class="pkg-label">tadeocar_description</text>
  <text x="330" y="475" text-anchor="middle" class="pkg-desc">URDF | Meshes | ZED2i STL | TF Tree</text>

  <!-- Arrows: Bringup -> perception -->
  <path d="M230 120 L155 175" class="arrow" stroke="#6b7280"/>
  <path d="M280 120 L365 175" class="arrow" stroke="#6b7280"/>
  <path d="M330 120 L530 175" class="arrow" stroke="#6b7280"/>

  <!-- Arrows: Perception -> core -->
  <path d="M155 230 L170 315" class="arrow" stroke="#6b7280"/>
  <path d="M365 230 L400 315" class="arrow" stroke="#6b7280"/>
  <path d="M575 230 L480 315" class="arrow" stroke="#6b7280"/>

  <!-- Arrows: Core -> foundation -->
  <path d="M180 370 L290 435" class="arrow" stroke="#6b7280"/>
  <path d="M440 370 L370 435" class="arrow" stroke="#6b7280"/>

  <!-- Legend -->
  <rect x="690" y="70" width="190" height="160" rx="8" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
  <text x="785" y="92" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Legend</text>
  <rect x="705" y="102" width="14" height="14" rx="3" fill="url(#grad-bringup)"/>
  <text x="727" y="113" font-size="10" fill="#4b5563">Orchestration</text>
  <rect x="705" y="124" width="14" height="14" rx="3" fill="url(#grad-nav)"/>
  <text x="727" y="135" font-size="10" fill="#4b5563">Perception / Planning</text>
  <rect x="705" y="146" width="14" height="14" rx="3" fill="url(#grad-core)"/>
  <text x="727" y="157" font-size="10" fill="#4b5563">Control</text>
  <rect x="705" y="168" width="14" height="14" rx="3" fill="url(#grad-sim)"/>
  <text x="727" y="179" font-size="10" fill="#4b5563">Simulation</text>
  <rect x="705" y="190" width="14" height="14" rx="3" fill="url(#grad-desc)"/>
  <text x="727" y="201" font-size="10" fill="#4b5563">Description / Model</text>
</svg>
