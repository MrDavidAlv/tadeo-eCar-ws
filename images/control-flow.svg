<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <style>
      .box { rx: 8; ry: 8; stroke-width: 2; }
      .label { font-size: 12px; font-weight: 600; fill: #ffffff; }
      .detail { font-size: 9.5px; fill: #d1d5db; }
      .topic { font-size: 9px; font-family: 'Courier New', monospace; fill: #94a3b8; }
      .arrow { stroke-width: 2.5; fill: none; marker-end: url(#ah); }
      .arrow-thin { stroke-width: 1.5; fill: none; marker-end: url(#ah2); }
      .priority { font-size: 9px; font-weight: 700; }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="ah2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="440" fill="#fafbfc" rx="12"/>
  <rect x="0" y="0" width="920" height="50" fill="#1a1a2e" rx="12"/>
  <rect x="0" y="25" width="920" height="25" fill="#1a1a2e"/>
  <text x="460" y="33" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Control Flow - twist_mux + 4WS Kinematics</text>

  <!-- Input sources -->
  <rect x="30" y="80" width="140" height="50" class="box" fill="#7c3aed" stroke="#6d28d9"/>
  <text x="100" y="102" text-anchor="middle" class="label">Xbox Controller</text>
  <text x="100" y="118" text-anchor="middle" class="detail">cmd_vel_joy</text>
  <text x="195" y="105" class="priority" fill="#ef4444">P:100</text>

  <rect x="30" y="145" width="140" height="50" class="box" fill="#6366f1" stroke="#4f46e5"/>
  <text x="100" y="167" text-anchor="middle" class="label">Web Control</text>
  <text x="100" y="183" text-anchor="middle" class="detail">cmd_vel_web</text>
  <text x="195" y="170" class="priority" fill="#f97316">P:90</text>

  <rect x="30" y="210" width="140" height="50" class="box" fill="#3b82f6" stroke="#2563eb"/>
  <text x="100" y="232" text-anchor="middle" class="label">Teleop GUI</text>
  <text x="100" y="248" text-anchor="middle" class="detail">cmd_vel_teleop</text>
  <text x="195" y="235" class="priority" fill="#eab308">P:50</text>

  <rect x="30" y="275" width="140" height="50" class="box" fill="#0ea5e9" stroke="#0284c7"/>
  <text x="100" y="297" text-anchor="middle" class="label">Nav2</text>
  <text x="100" y="313" text-anchor="middle" class="detail">cmd_vel_nav</text>
  <text x="195" y="300" class="priority" fill="#22c55e">P:10</text>

  <!-- E-stop -->
  <rect x="30" y="350" width="140" height="45" class="box" fill="#dc2626" stroke="#b91c1c"/>
  <text x="100" y="370" text-anchor="middle" class="label">E-STOP</text>
  <text x="100" y="385" text-anchor="middle" class="detail">Locks all output</text>
  <text x="195" y="372" class="priority" fill="#dc2626">P:255</text>

  <!-- twist_mux -->
  <rect x="260" y="155" width="150" height="100" class="box" fill="#1e3a5f" stroke="#16304d"/>
  <text x="335" y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">twist_mux</text>
  <text x="335" y="215" text-anchor="middle" font-size="10" fill="#93c5fd">Priority arbiter</text>
  <text x="335" y="235" text-anchor="middle" class="detail">Highest priority wins</text>

  <!-- Arrows to twist_mux -->
  <path d="M170 105 L260 185" class="arrow-thin" stroke="#7c3aed"/>
  <path d="M170 170 L260 195" class="arrow-thin" stroke="#6366f1"/>
  <path d="M170 235 L260 205" class="arrow-thin" stroke="#3b82f6"/>
  <path d="M170 300 L260 215" class="arrow-thin" stroke="#0ea5e9"/>
  <path d="M170 372 L260 240" class="arrow-thin" stroke="#dc2626"/>

  <!-- /cmd_vel topic -->
  <rect x="435" y="185" width="100" height="40" rx="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="485" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">/cmd_vel</text>

  <path d="M410 205 L435 205" class="arrow" stroke="#475569"/>

  <!-- Kinematics node -->
  <rect x="560" y="140" width="160" height="130" class="box" fill="#1e3a5f" stroke="#16304d"/>
  <text x="640" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4WS Kinematics</text>
  <text x="640" y="190" text-anchor="middle" font-size="10" fill="#93c5fd">Inverse Kinematics</text>
  <line x1="580" y1="200" x2="700" y2="200" stroke="#334155" stroke-width="1"/>
  <text x="640" y="218" text-anchor="middle" font-size="9" fill="#d1d5db">Omnidirectional</text>
  <text x="640" y="232" text-anchor="middle" font-size="9" fill="#d1d5db">Ackermann</text>
  <text x="640" y="246" text-anchor="middle" font-size="9" fill="#d1d5db">Crab / Spin</text>
  <text x="640" y="260" text-anchor="middle" font-size="9" fill="#d1d5db">L=1.058m W=0.55m</text>

  <path d="M535 205 L560 205" class="arrow" stroke="#475569"/>

  <!-- Output joints -->
  <rect x="755" y="75" width="145" height="48" class="box" fill="#4a6741" stroke="#3d5636"/>
  <text x="827" y="95" text-anchor="middle" class="label">Steering Joints</text>
  <text x="827" y="112" text-anchor="middle" class="topic">cmd_pos (rad)</text>

  <rect x="755" y="138" width="145" height="48" class="box" fill="#4a6741" stroke="#3d5636"/>
  <text x="827" y="158" text-anchor="middle" class="label">FL Steering</text>
  <text x="827" y="174" text-anchor="middle" class="topic">PID P:200 I:5 D:30</text>

  <rect x="755" y="200" width="145" height="48" class="box" fill="#4a6741" stroke="#3d5636"/>
  <text x="827" y="220" text-anchor="middle" class="label">FR | RL | RR</text>
  <text x="827" y="236" text-anchor="middle" class="topic">Same PID tuning</text>

  <rect x="755" y="275" width="145" height="48" class="box" fill="#2d4a6f" stroke="#22314E"/>
  <text x="827" y="295" text-anchor="middle" class="label">Wheel Joints</text>
  <text x="827" y="312" text-anchor="middle" class="topic">cmd_vel (rad/s)</text>

  <rect x="755" y="338" width="145" height="48" class="box" fill="#2d4a6f" stroke="#22314E"/>
  <text x="827" y="358" text-anchor="middle" class="label">4x Wheels</text>
  <text x="827" y="375" text-anchor="middle" class="topic">velocity control</text>

  <!-- Arrows to joints -->
  <path d="M720 175 L755 162" class="arrow-thin" stroke="#4a6741"/>
  <path d="M720 185 L755 224" class="arrow-thin" stroke="#4a6741"/>
  <path d="M720 210 L755 299" class="arrow-thin" stroke="#2d4a6f"/>
  <path d="M720 220 L755 362" class="arrow-thin" stroke="#2d4a6f"/>

  <!-- Gazebo label -->
  <rect x="760" y="400" width="135" height="25" rx="12" fill="#f1f5f9" stroke="#d1d5db"/>
  <text x="827" y="417" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">Ignition Gazebo</text>
</svg>
