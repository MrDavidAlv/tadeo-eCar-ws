<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <style>
      .box { rx: 8; ry: 8; stroke-width: 2; }
      .label { font-size: 12px; font-weight: 600; fill: #ffffff; }
      .detail { font-size: 9.5px; fill: #d1d5db; }
      .topic-tag { font-size: 8.5px; font-family: 'Courier New', monospace; fill: #94a3b8; }
      .arrow { stroke-width: 2; fill: none; marker-end: url(#ah); }
      .section-label { font-size: 10px; font-weight: 600; fill: #6b7280; text-transform: uppercase; letter-spacing: 1px; }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" fill="#fafbfc" rx="12"/>
  <rect x="0" y="0" width="900" height="50" fill="#1a1a2e" rx="12"/>
  <rect x="0" y="25" width="900" height="25" fill="#1a1a2e"/>
  <text x="450" y="33" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Sensor Pipeline - ZED2i + LiDAR</text>

  <!-- Sensor column -->
  <text x="30" y="80" class="section-label">SENSORS (GAZEBO)</text>

  <!-- ZED2i Camera -->
  <rect x="30" y="92" width="200" height="110" class="box" fill="#1e3a5f" stroke="#16304d"/>
  <text x="130" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">ZED2i Stereo</text>
  <line x1="45" y1="122" x2="215" y2="122" stroke="#2d4a6f"/>
  <text x="130" y="138" text-anchor="middle" class="detail">Baseline: 0.12m</text>
  <text x="130" y="153" text-anchor="middle" class="detail">HFOV: 110 deg | 1280x720</text>
  <text x="130" y="168" text-anchor="middle" class="detail">15 fps | Noise: 0.005 std</text>
  <text x="130" y="188" text-anchor="middle" class="topic-tag">zed/zed_node/left/image_rect_color</text>

  <!-- IMU -->
  <rect x="30" y="215" width="200" height="70" class="box" fill="#4a3860" stroke="#3d2d52"/>
  <text x="130" y="238" text-anchor="middle" class="label">ZED2i IMU (BMI088)</text>
  <text x="130" y="255" text-anchor="middle" class="detail">400 Hz | gyro: 0.0002 rad/s</text>
  <text x="130" y="270" text-anchor="middle" class="topic-tag">zed/zed_node/imu/data_raw</text>

  <!-- LiDAR -->
  <rect x="30" y="300" width="200" height="70" class="box" fill="#4a6741" stroke="#3d5636"/>
  <text x="130" y="323" text-anchor="middle" class="label">LiDAR 2D</text>
  <text x="130" y="340" text-anchor="middle" class="detail">Range: 3.5m | 360 deg</text>
  <text x="130" y="358" text-anchor="middle" class="topic-tag">/scan</text>

  <!-- Bridge column -->
  <text x="280" y="80" class="section-label">ROS_GZ_BRIDGE</text>

  <rect x="280" y="92" width="110" height="280" class="box" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4,3"/>
  <text x="335" y="195" text-anchor="middle" font-size="11" font-weight="600" fill="#475569" transform="rotate(-90 335 195)">parameter_bridge</text>
  <text x="355" y="150" text-anchor="middle" font-size="9" fill="#94a3b8">Gz -&gt; ROS2</text>
  <text x="355" y="240" text-anchor="middle" font-size="9" fill="#94a3b8">Image</text>
  <text x="355" y="255" text-anchor="middle" font-size="9" fill="#94a3b8">CameraInfo</text>
  <text x="355" y="270" text-anchor="middle" font-size="9" fill="#94a3b8">IMU</text>
  <text x="355" y="285" text-anchor="middle" font-size="9" fill="#94a3b8">LaserScan</text>
  <text x="355" y="300" text-anchor="middle" font-size="9" fill="#94a3b8">Odometry</text>

  <!-- Arrows sensor -> bridge -->
  <path d="M230 147 L280 147" class="arrow" stroke="#475569"/>
  <path d="M230 250 L280 250" class="arrow" stroke="#475569"/>
  <path d="M230 335 L280 335" class="arrow" stroke="#475569"/>

  <!-- Consumer column -->
  <text x="440" y="80" class="section-label">CONSUMERS (ROS2)</text>

  <!-- RTAB-Map -->
  <rect x="440" y="92" width="190" height="100" class="box" fill="#6b4c8a" stroke="#5a3d76"/>
  <text x="535" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">RTAB-Map</text>
  <text x="535" y="132" text-anchor="middle" class="detail">Visual SLAM</text>
  <line x1="455" y1="139" x2="615" y2="139" stroke="#5a3d76"/>
  <text x="535" y="155" text-anchor="middle" class="detail">Stereo images + Odom</text>
  <text x="535" y="170" text-anchor="middle" class="detail">Loop closure + 3D map</text>
  <text x="535" y="183" text-anchor="middle" class="topic-tag">/rtabmap/cloud_map</text>

  <!-- SLAM Toolbox -->
  <rect x="440" y="210" width="190" height="75" class="box" fill="#1e3a5f" stroke="#16304d"/>
  <text x="535" y="233" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">SLAM Toolbox</text>
  <text x="535" y="250" text-anchor="middle" class="detail">LiDAR SLAM (async)</text>
  <text x="535" y="265" text-anchor="middle" class="detail">Scan matching + odom</text>
  <text x="535" y="278" text-anchor="middle" class="topic-tag">/map</text>

  <!-- Nav2 -->
  <rect x="440" y="300" width="190" height="70" class="box" fill="#0e4a6f" stroke="#0c3d5c"/>
  <text x="535" y="323" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Nav2</text>
  <text x="535" y="340" text-anchor="middle" class="detail">AMCL + Costmaps + DWB</text>
  <text x="535" y="356" text-anchor="middle" class="topic-tag">/cmd_vel_nav</text>

  <!-- Arrows bridge -> consumers -->
  <path d="M390 140 L440 140" class="arrow" stroke="#6b4c8a"/>
  <path d="M390 250 L440 250" class="arrow" stroke="#1e3a5f"/>
  <path d="M390 335 L440 335" class="arrow" stroke="#0e4a6f"/>

  <!-- Output column -->
  <text x="680" y="80" class="section-label">OUTPUT</text>

  <rect x="680" y="105" width="190" height="55" class="box" fill="#374151" stroke="#4b5563"/>
  <text x="775" y="128" text-anchor="middle" class="label">3D Point Cloud Map</text>
  <text x="775" y="148" text-anchor="middle" class="topic-tag">/rtabmap/cloud_map</text>

  <rect x="680" y="180" width="190" height="55" class="box" fill="#374151" stroke="#4b5563"/>
  <text x="775" y="203" text-anchor="middle" class="label">2D Occupancy Grid</text>
  <text x="775" y="223" text-anchor="middle" class="topic-tag">/map (OccupancyGrid)</text>

  <rect x="680" y="255" width="190" height="55" class="box" fill="#374151" stroke="#4b5563"/>
  <text x="775" y="278" text-anchor="middle" class="label">Localization (TF)</text>
  <text x="775" y="298" text-anchor="middle" class="topic-tag">map -&gt; odom -&gt; base_link</text>

  <rect x="680" y="330" width="190" height="40" class="box" fill="#374151" stroke="#4b5563"/>
  <text x="775" y="355" text-anchor="middle" class="label">Velocity Commands</text>

  <!-- Arrows consumers -> output -->
  <path d="M630 135 L680 130" class="arrow" stroke="#64748b"/>
  <path d="M630 248 L680 207" class="arrow" stroke="#64748b"/>
  <path d="M630 260 L680 280" class="arrow" stroke="#64748b"/>
  <path d="M630 340 L680 350" class="arrow" stroke="#64748b"/>
</svg>
