    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      # 12 s rather than 8. Every leg begins with the four steering servos
      # swinging into line, which takes up to half a second during which the
      # robot has not moved at all, and a rotate-to-heading at the start of a
      # path spends several seconds turning without translating.
      movement_time_allowance: 12.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      # Regulated Pure Pursuit, not DWB.
      #
      # DWB samples a velocity window and scores whole trajectories, which
      # assumes the robot can take any velocity in that window right now. This
      # one cannot: a 4WS chassis has to swing four servos before it travels in
      # a new direction, about half a second for a 90 degree change. Every DWB
      # trajectory was therefore scored against motion the robot would not
      # perform, and the controller reacted to the mismatch by picking a
      # different velocity next cycle. Traced at 2 Hz, it settled into
      # commanding vx=0, vy=0 and wz alternating between +0.09 and -0.09 rad/s
      # every single cycle, with the wheels parked at -60 degrees: the robot
      # vibrated in place until the progress checker aborted the goal.
      #
      # Pure pursuit asks a different question - which way is the path, a
      # lookahead ahead of me - and the answer moves smoothly, so the commanded
      # direction moves smoothly and the servos can keep up with it.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.8
      # A lookahead of about one robot length. Shorter and the robot cuts
      # corners it is too long to cut; longer and it stops tracking the path.
      lookahead_dist: 1.4
      min_lookahead_dist: 0.7
      max_lookahead_dist: 2.2
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      # Slow down for curvature and near obstacles. On a 1.42 m long robot
      # taking a 0.9 m radius turn at full speed, the tail sweeps wide.
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 1.0
      # Turn on the spot when the path starts off behind the robot, rather
      # than driving a long arc to get onto it. This robot can do that; a
      # car cannot, which is why the option exists.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 1.2
      # Reversing is disabled because only the forward half of the robot is
      # instrumented: the LiDAR is 360 degrees but the camera is not, and the
      # deck overhangs the rear axle by 0.18 m.
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: True
      rolling_window: true
      # 6 x 6 m, not 3 x 3. DWB rolls trajectories forward for sim_time
      # seconds, so at 1 m/s it looks 1.0 m ahead from a robot that is itself
      # 1.42 m long; a 3 m window put both ends of that outside the costmap and
      # the controller was steering around obstacles it could no longer see.
      width: 6
      height: 6
      resolution: 0.05
      # The deck, measured off chasis_base.dae: 1.418 x 0.815 m, spanning
      # x [-0.757, 0.661] about base_link. The old footprint was 1.16 x 0.65,
      # which is the wheels - and the deck overhangs them on every side, so
      # Nav2 was planning paths that fit a robot 16 cm narrower than this one.
      footprint: "[[-0.757, -0.408], [-0.757, 0.408], [0.661, 0.408], [0.661, -0.408]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # The robot's inscribed radius is 0.408 m - half the deck's width - so
        # an inflation radius of 0.55 left the planner free to route the centre
        # 0.55 m from an obstacle, which puts the deck's corner 0.15 m from it.
        # Pure pursuit's own collision check then refused to drive the path its
        # planner had produced. 0.85 m leaves a body width of clearance and
        # still keeps 1.3 m of zero-cost corridor down the 3 m cross aisle.
        cost_scaling_factor: 2.5
        inflation_radius: 0.85
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # Matched to the 8 m sensor. At 3.0 m the costmap cleared stale
          # obstacles only within 3 m of the robot, so anything seen once from
          # further out stayed marked for good.
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.0
          obstacle_min_range: 0.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: True
      # The deck, measured off chasis_base.dae: 1.418 x 0.815 m, spanning
      # x [-0.757, 0.661] about base_link. The old footprint was 1.16 x 0.65,
      # which is the wheels - and the deck overhangs them on every side, so
      # Nav2 was planning paths that fit a robot 16 cm narrower than this one.
      footprint: "[[-0.757, -0.408], [-0.757, 0.408], [0.661, 0.408], [0.661, -0.408]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # Matched to the 8 m sensor. At 3.0 m the costmap cleared stale
          # obstacles only within 3 m of the robot, so anything seen once from
          # further out stayed marked for good.
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # The robot's inscribed radius is 0.408 m - half the deck's width - so
        # an inflation radius of 0.55 left the planner free to route the centre
        # 0.55 m from an obstacle, which puts the deck's corner 0.15 m from it.
        # Pure pursuit's own collision check then refused to drive the path its
        # planner had produced. 0.85 m leaves a body width of clearance and
        # still keeps 1.3 m of zero-cost corridor down the 3 m cross aisle.
        cost_scaling_factor: 2.5
        inflation_radius: 0.85
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    # 1 Hz is the rate the behaviour tree actually calls the planner at.
    # Declaring 20 produces a warning on every cycle and changes nothing else.
    expected_planner_frequency: 1.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [1.0, 1.0, 1.0]
    min_velocity: [-1.0, -1.0, -1.0]
    max_accel: [2.0, 2.0, 2.5]
    max_decel: [-2.0, -2.0, -2.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
